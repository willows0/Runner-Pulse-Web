name: Runner Pulse - verifica regole Firestore (solo emulatore)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Installa librerie di test (nessun collegamento alla produzione)
        run: npm install --no-audit --no-fund
        working-directory: security/firestore-audit
      - name: Avvia l'emulatore Firestore e verifica accessi simulati
        run: npx --yes firebase-tools@15.37.0 emulators:exec --only firestore --project demo-runner-pulse-firestore-audit 'npm test'
        working-directory: security/firestore-audit
