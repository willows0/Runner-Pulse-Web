name: Runner Pulse – sicurezza e test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Installa dipendenze senza script post-install
        run: |
          if [ -f package-lock.json ]; then npm ci --ignore-scripts --no-fund; else npm install --ignore-scripts --no-fund; echo '::warning::Manca package-lock.json; generarlo dal workflow dedicato e aggiungerlo al repository.'; fi
      - name: Controllo vulnerabilità gravi
        run: npm audit --omit=dev --audit-level=high
      - name: Test regressione
        run: npm test
      - name: Verifica sintassi dei file principali
        run: |
          node --check server.js
          node --check coach-api.js
          node --check google-calendar-integration.js
